<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sixieme Terre</title>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="icon" href="src/assets/avatarka_faux.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
    <link href='https://unpkg.com/css.gg@2.0.0/icons/css/all.css' rel='stylesheet'>
</head>
<body class="page-map">

    <!-- ===== ЛЕВАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ (САМАЯ ПЕРВАЯ, ВНЕ ВСЕХ КОНТЕЙНЕРОВ) ===== -->
    <div class="left-tools">
                <button
        id="map-modes-toggle"
        class="left-tool-btn map-modes-toggle"
        title="Режимы карт"
        ><span class="material-icons">map</span>
    </button>
    <button id="sidebar-toggle" class="left-tool-btn" title="Меню">
            <span class="material-icons">menu</span>
        </button>
        <button id="markers-toggle" class="left-tool-btn" title="Маркеры">
            <span class="material-icons">place</span>
        </button>
        <button id="filters-toggle" class="left-tool-btn" title="Фильтры">
            <span class="material-icons">filter_list</span>
        </button>
        <button id="fullscreen-btn" class="left-tool-btn" title="Полноэкранный режим">
            <span class="material-icons">fullscreen</span>
        </button>
        <button id="coords-toggle" class="left-tool-btn" title="Координаты">
            <span class="material-icons">gps_fixed</span>
        </button>
        <button id="info-toggle" class="left-tool-btn" title="Условные обозначения">
            <span class="material-icons">info</span>
        </button>
    </div>

    <!-- Список провинций -->
    <button id="open-province-panel" class="open-province-btn" title="Список провинций">
        <span class="material-icons">auto_stories</span>
    </button>

    <!-- ===== ПАНЕЛЬ РЕЖИМОВ КАРТЫ ===== -->
    <div id="map-modes-panel" class="tool-panel map-modes-panel">

    <div class="map-modes-header">
        <div>
            <span class="material-icons">map</span>
            <div>
                <h3>Режимы карты</h3>
                <p>Выберите представление мира</p>
            </div>
        </div>
    </div>

    <div
        id="map-mode-list"
        class="map-mode-list"
    ></div>
    </div>

<!-- ===== ПАНЕЛИ ИНСТРУМЕНТОВ (ВЫЕЗЖАЮЩИЕ) ===== -->
    <div id="markers-panel" class="tool-panel">
        <div class="filter-section">
            <h4>Маркеры</h4>
            <div id="marker-filters"></div>
        </div>
    </div>

    <div id="filters-panel" class="tool-panel">
        <!-- Сюда динамически будут подгружаться фильтры -->
    </div>

    <div id="coords-panel" class="tool-panel">
        <div class="filter-section">
            <h4>Координаты</h4>
            <p id="coords-display" style="font-family: 'Courier New', monospace; font-size: 1.1rem; margin: 8px 0;">
                X: 0, Y: 0
            </p>
            <button id="coords-mode-toggle" class="wiki-link" style="width: 100%; text-align: center; margin-bottom: 6px;">
                Выкл
            </button>
            <button id="copy-coords-btn" class="wiki-link" style="width: 100%; text-align: center;">
                Копировать
            </button>
            <button id="clear-crosshair-btn" class="wiki-link" style="width: 100%; text-align: center; margin-top: 6px;">
                Сброс
            </button>
        </div>
    </div>

    <!-- ===== БОКОВАЯ ПАНЕЛЬ (ГАМБУРГЕР) ===== -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Навигация</h3>
            <button id="sidebar-close" class="sidebar-close">
                <span class="material-icons">close</span>
            </button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-footer">
                <a href="index.html" class="sidebar-link">🏠 На главную</a>
                <a href="wiki.html" class="sidebar-link">📖 Вики</a>
                <a href="stats.html" class="sidebar-link">📊 Статистика</a>
                <a href="settings.html" class="sidebar-link">⚙️ Настройки</a>
                <a href="admin.html" class="sidebar-link">🔧 Админка</a>
            </div>
        </div>
    </div>

    <!-- ===== КАРТА ===== -->
    <div id="map"></div>

    <!-- ===== ИНФОРМАЦИОННАЯ ПАНЕЛЬ (ДЛЯ МАРКЕРОВ И ПРОВИНЦИЙ) ===== -->
    <div id="info-panel" class="info-panel" style="display: none;"></div>

    <!-- ===== ПОЛНОЭКРАННАЯ ПАНЕЛЬ ПРОВИНЦИЙ ===== -->
<div id="province-panel" class="fullscreen-panel" style="display: none;">
    <div class="panel-header">
        <h2>📋 Список провинций</h2>
        <button id="close-province-panel" class="panel-close-btn">✖</button>
    </div>
    <div class="panel-content">
        <!-- Поиск -->
        <div class="panel-search">
            <input type="text" id="panel-search-input" placeholder="Поиск по ID или названию...">
            <button id="panel-search-mode" class="panel-search-btn">🔍 ID</button>
            <button id="panel-sort-toggle" class="panel-search-btn">Сорт: ID</button>
            <button id="panel-search-submit" class="panel-search-btn">🔍 Найти</button>
            <button id="panel-reset-filters" class="panel-reset-btn">Сбросить фильтры</button>
            <span id="panel-count" class="panel-count">—</span>
        </div>
        <!-- Фильтры (будут позже) -->
        <div id="panel-filters-container"></div>
        <!-- Список провинций -->
        <div id="panel-province-list" class="panel-province-grid"></div>
    </div>
</div>

    <!-- ===== СКРИПТЫ ===== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
